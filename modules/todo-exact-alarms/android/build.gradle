plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.todoexactalarms'
version = '1.0.0'

android {
  namespace 'expo.modules.todoexactalarms'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // SDK 57 may link Expo modules as prebuilt artifacts rather than projects.
  implementation expoModule.getExpoDependency('expo-notifications')
}
